apis:
- aid: dt-agent-co-uk:neva-a2a-agent
  name: Neva A2A Agent
  description: >-
    Neva's agent-to-agent surface: an anonymous A2A 0.3.0 JSON-RPC endpoint at the root of
    neva.dt-agent.co.uk (POST only; GET returns 405) implementing the a2a-sdk method set. message/send takes
    a full Message with a mandatory client-supplied messageId and {"kind":"text","text":...} parts; there is
    no streaming, no push notifications, no queryable tasks and no authenticated extended card. One skill,
    build-with-us. On 2026-09-19 a well-formed message/send returned JSON-RPC -32603 wrapping an upstream
    HTTP 401 "API key is invalid" - the agent's own model-provider credential - so the agent validates but
    does not currently reply. No OpenAPI, documentation or SDK.
  humanURL: https://neva.dt-agent.co.uk/.well-known/agent-card.json
  baseURL: https://neva.dt-agent.co.uk/

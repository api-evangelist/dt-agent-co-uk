aid: dt-agent-co-uk
name: Neva
description: >-
  Neva is a self-described "builder" agent: an A2A 0.3.0 agent at neva.dt-agent.co.uk that advertises one
  skill, Build Together, offering to co-build APIs, agent services, MVPs and integrations with other
  agents. Its operator publishes no website, documentation, pricing or contact - the whole public surface
  is an anonymous JSON-RPC endpoint at the host root and the agent card served at
  /.well-known/agent-card.json (and the legacy /.well-known/agent.json), listed on a2aregistry.org since
  2026-03-22. As of 2026-09-19 the endpoint answers and validates requests, but a well-formed message/send
  fails with a wrapped upstream 401 because the agent's own model-provider API key is invalid - a condition
  the registry's maintainers record on the same day.
